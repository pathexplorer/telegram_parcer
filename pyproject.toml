[build-system]
requires = ["setuptools>=61.0", "keyrings.google-artifactregistry-auth"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-parcer"
version = "1.0.0"
description = "Telegram monitoring tool — scans public channels for keywords and sends alerts"
requires-python = "==3.12.*"
dependencies = [
    "python-dotenv",
    "telethon",
    "google-cloud-secret-manager",
    "google-cloud-firestore",
    "google-cloud-storage",
    "google-cloud-logging",
    "flask",
    "aiohttp",
    "gcp-actions==0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# ── uv-specific: where to find gcp-actions ──
[tool.uv.sources]
gcp-actions = { path = "../gcp_actions", editable = true }

# ── Private PyPI mirror (Artifact Registry) ──
[[tool.uv.index]]
name = "bike-data-magic"
url = "https://us-central1-python.pkg.dev/handy-cache-476919-t4/bike-data-magic/simple/"
explicit = true

# Fallback to public PyPI
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.setuptools.packages.find]
include = ["telegram*", "emergency*", "project_env*", "tests*"]

# ── pytest ──
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require a real (or emulated) network dependency",
    "unit: fast, isolated unit tests",
]

[tool.coverage.run]
source = ["telegram_parcer", "telegram", "emergency", "project_env"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self\\.debug:",
    "if settings\\.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]