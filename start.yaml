# ──────────────────────────────────────────────────────────────────────
# Cloud Build configuration — deploy the Telegram Poller Cloud Function.
#
# The following substitutions MUST be supplied by the Cloud Build trigger
# (or via `gcloud builds submit --substitutions=...`):
#
#   _GCP_PROJECT_ID   — GCP project ID (required)
#   _SERVICE_ACCOUNT  — Service account email for the function (required)
#   _FUNCTION_NAME    — Cloud Function name (default: telegramPoller)
#   _REGION           — Deployment region (default: us-central1)
#   _RUNTIME          — Python runtime (default: python312)
#   _TELEGRAM_SECRETS — Secret Manager secret name (default: telegram-secrets)
#   _TAG_NAME         — Code version tag (default: latest)
#   _LOGGING_LEVEL    — Logging level (default: INFO)
#   _MAX_POLL_SECONDS — Max poll duration, seconds (default: 450)
#   _ARTIFACT_REPO    — Artifact Registry repo name for private packages
#
# Required IAM roles for the Cloud Build service account:
#   - Cloud Functions Developer
#   - Service Account User (on $_SERVICE_ACCOUNT)
#   - Artifact Registry Reader (on the private package repository)
# ──────────────────────────────────────────────────────────────────────

substitutions:
  _FUNCTION_NAME: telegramPoller
  _REGION: us-central1
  _SERVICE_ACCOUNT: ""                          # supplied by build trigger
  _RUNTIME: python312
  _TELEGRAM_SECRETS: "telegram-secrets"
  _TAG_NAME: latest
  _GCP_PROJECT_ID: ""                           # auto-detected by deploy.sh, or set by build trigger
  _LOGGING_LEVEL: INFO
  _ARTIFACT_REPO: ""                            # supplied by build trigger
  # Leave 50 s buffer below the Gen 1 HTTP function limit (540 s) for
  # graceful shutdown, cursor flush, and session cleanup.
  _MAX_POLL_SECONDS: "450"

steps:
# ── Deploy ──────────────────────────────────────────────────────────────
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  args:
  - gcloud
  - functions
  - deploy
  - $_FUNCTION_NAME
  - --region=$_REGION
  - --source=.
  - --entry-point=main
  - --runtime=$_RUNTIME
  - --trigger-http
  - --memory=512MB
  - --max-instances=1
  - --service-account=$_SERVICE_ACCOUNT
  - --set-env-vars=GCP_PROJECT_ID=$_GCP_PROJECT_ID,CODE_VERSION=$_TAG_NAME,TELEGRAM_SECRETS=$_TELEGRAM_SECRETS,LOGGING_LEVEL=$_LOGGING_LEVEL,MAX_POLL_SECONDS=$_MAX_POLL_SECONDS,HEARTBEAT_MAX_AGE_SECONDS=7200
  - --set-build-env-vars=PIP_EXTRA_INDEX_URL=https://us-central1-python.pkg.dev/$_GCP_PROJECT_ID/$_ARTIFACT_REPO/simple/

# Gen 1 HTTP function max timeout is 540 s.
timeout: '500s'