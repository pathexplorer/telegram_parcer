substitutions:
  _FUNCTION_NAME: telegramPoller
  _REGION: us-central1
  _SERVICE_ACCOUNT: tele-looker-wizard@handy-cache-476919-t4.iam.gserviceaccount.com
  _RUNTIME: python312
  _TELEGRAM_SECRETS: "telegram-secrets"
  _TAG_NAME: v3.0.5
  _GCP_PROJECT_ID: "handy-cache-476919-t4"
  _LOGGING_LEVEL: INFO
  # Leave 50 s buffer below the Gen 1 HTTP function limit (540 s) for
  # graceful shutdown, cursor flush, and session cleanup.
  _MAX_POLL_SECONDS: "450"

steps:
# ── Deploy ──────────────────────────────────────────────────────────────
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  args:
  - gcloud
  - functions
  - deploy
  - $_FUNCTION_NAME
  - --region=$_REGION
  - --source=.
  - --entry-point=main
  - --runtime=$_RUNTIME
  - --trigger-http
  - --memory=512MB
  - --max-instances=1
  - --service-account=$_SERVICE_ACCOUNT
  - --set-env-vars=GCP_PROJECT_ID=$_GCP_PROJECT_ID,CODE_VERSION=$_TAG_NAME,TELEGRAM_SECRETS=$_TELEGRAM_SECRETS,LOGGING_LEVEL=$_LOGGING_LEVEL,MAX_POLL_SECONDS=$_MAX_POLL_SECONDS
  - --set-build-env-vars=PIP_EXTRA_INDEX_URL=https://us-central1-python.pkg.dev/$_GCP_PROJECT_ID/bike-data-magic/simple/

# Gen 1 HTTP function max timeout is 540 s.
timeout: '500s'